name: Android APK

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk FaceID-Ecole.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FaceID-Ecole-apk
          path: mobile/FaceID-Ecole.apk

      - name: Publish as downloadable pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: apk-${{ github.ref_name }}
        run: |
          TAG="${TAG//\//-}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" FaceID-Ecole.apk \
            --target "$GITHUB_SHA" --prerelease \
            --title "FaceID École – ${GITHUB_REF_NAME} (${GITHUB_SHA::7})" \
            --notes "APK Android compilé automatiquement depuis la branche ${GITHUB_REF_NAME}. Téléchargez FaceID-Ecole.apk depuis le téléphone pour l'installer."
